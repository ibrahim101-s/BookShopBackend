spring.application.name=BookShop
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/bookshop;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
jwt.secret=${JWT_SECRET:BookShopSecretKeyForJwtTokenGeneration123456789012345}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501
